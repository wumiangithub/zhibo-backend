openapi: "3.0.3"
info:
  title: zhibo API（admin + live）
  description: |
    钱坤直播全站 OpenAPI，供 Apifox 一次导入。
    
    - admin-service：`http://127.0.0.1:8081`
    - live-service：`http://127.0.0.1:8082`
    
    契约：`zhibo-shared/docs/API约定.md`。
    分服务文件：`admin-service.openapi.yaml` / `live-service.openapi.yaml`。
    
    导入后请在 Apifox 按 Tag 前缀区分服务；调试时切换对应 Server。
  version: "2.0.0"
  contact:
    name: zhibo
servers:
  - url: "http://127.0.0.1:8081"
    description: admin-service
  - url: "http://127.0.0.1:8082"
    description: live-service
tags:
  - name: admin/登录鉴权
  - name: admin/图片上传
  - name: admin/素材中心
  - name: admin/活动管理
  - name: admin/统计
  - name: admin/中控台
  - name: admin/员工组织
  - name: live/观看
  - name: live/进出房
  - name: live/中控台
  - name: live/回调
paths:
  /api/auth/captcha:
    get:
      tags:
        - admin/登录鉴权
      summary: 图形验证码
      operationId: admin_getCaptcha
      security: []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCaptcha"
  /api/auth/login:
    post:
      tags:
        - admin/登录鉴权
      summary: 账号密码登录（返回微信 state，不发 JWT）
      operationId: admin_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLoginPending"
  /api/auth/wechat/callback:
    get:
      tags:
        - admin/登录鉴权
      summary: 微信扫码回调（GET）
      description: 微信 redirect；建议返回极简 HTML。正式 Token 只经 login/query。
      operationId: admin_wechatCallbackGet
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        200:
          description: HTML 或业务结果
    post:
      tags:
        - admin/登录鉴权
      summary: 微信扫码回调（POST）
      operationId: admin_wechatCallbackPost
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        200:
          description: HTML 或业务结果
  /api/auth/login/query:
    get:
      tags:
        - admin/登录鉴权
      summary: 轮询扫码结果 / 取 JWT
      operationId: admin_loginQuery
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLoginQuery"
  /api/auth/refresh:
    post:
      tags:
        - admin/登录鉴权
      summary: 刷新 access + refresh
      operationId: admin_refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTokenPair"
  /api/auth/me:
    get:
      tags:
        - admin/登录鉴权
      summary: 当前员工
      operationId: admin_getMe
      security:
        - BearerAuth:
            []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMe"
  /api/uploads/image:
    post:
      tags:
        - admin/图片上传
      summary: 图片上传（代理微吼）
      operationId: admin_uploadImage
      security:
        - BearerAuth:
            []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: bmp/gif/jpg/jpeg/png/psd，≤5MB
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUploadImage"
  /api/uploads/tos-sts:
    get:
      tags:
        - admin/图片上传
      summary: 火山 TOS 临时上传凭证
      operationId: admin_getTosSts
      security:
        - BearerAuth:
            []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTosSts"
  /api/materials/groups:
    get:
      tags:
        - admin/素材中心
      summary: 分组列表
      operationId: admin_listMaterialGroups
      security:
        - BearerAuth:
            []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MaterialType"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialGroups"
    post:
      tags:
        - admin/素材中心
      summary: 新建分组
      operationId: admin_createMaterialGroup
      security:
        - BearerAuth:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - name
              properties:
                type:
                  $ref: "#/components/schemas/MaterialType"
                name:
                  type: string
                  maxLength: 64
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialGroup"
  /api/materials/groups/{id}:
    put:
      tags:
        - admin/素材中心
      summary: 重命名分组
      operationId: admin_renameMaterialGroup
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 64
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialGroup"
    delete:
      tags:
        - admin/素材中心
      summary: 删除分组
      operationId: admin_deleteMaterialGroup
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
  /api/materials:
    get:
      tags:
        - admin/素材中心
      summary: 素材分页列表
      operationId: admin_listMaterials
      security:
        - BearerAuth:
            []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
        - name: keyword
          in: query
          schema:
            type: string
        - name: selectableOnly
          in: query
          schema:
            type: boolean
            default: false
          description: true 时仅两审均为 passed
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 从 1 起（D37）
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialList"
    post:
      tags:
        - admin/素材中心
      summary: 批量登记（TOS 上传成功后）
      operationId: admin_registerMaterials
      security:
        - BearerAuth:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRegisterRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialRegister"
  /api/materials/articles:
    post:
      tags:
        - admin/素材中心
      summary: 新建文章
      operationId: admin_createArticle
      security:
        - BearerAuth:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreateRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/materials/articles/{id}:
    get:
      tags:
        - admin/素材中心
      summary: 文章详情
      operationId: admin_getArticle
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseArticleDetail"
    put:
      tags:
        - admin/素材中心
      summary: 编辑文章
      description: 待审核不可编辑；成功后两审回 pending
      operationId: admin_updateArticle
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
                - content
              properties:
                title:
                  type: string
                  maxLength: 45
                author:
                  type: string
                  maxLength: 16
                content:
                  type: string
                  maxLength: 100000
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/materials/{id}:
    put:
      tags:
        - admin/素材中心
      summary: 修改展示名
      operationId: admin_renameMaterial
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 256
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
    delete:
      tags:
        - admin/素材中心
      summary: 软删素材
      operationId: admin_deleteMaterial
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
  /api/materials/{id}/group:
    put:
      tags:
        - admin/素材中心
      summary: 移动分组
      operationId: admin_moveMaterialGroup
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
              properties:
                groupId:
                  type: string
                  format: uuid
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/materials/{id}/image:
    put:
      tags:
        - admin/素材中心
      summary: 裁剪替换图片
      operationId: admin_replaceMaterialImage
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - objectKey
              properties:
                url:
                  type: string
                objectKey:
                  type: string
                fileSize:
                  type: integer
                meta:
                  type: string
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/materials/{id}/ai-audit:
    put:
      tags:
        - admin/素材中心
      summary: 改 AI 审核状态
      operationId: admin_updateMaterialAiAudit
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/AuditWriteStatus"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/materials/{id}/risk-audit:
    put:
      tags:
        - admin/素材中心
      summary: 改风控合规状态
      operationId: admin_updateMaterialRiskAudit
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/AuditWriteStatus"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaterialItem"
  /api/activities:
    post:
      tags:
        - admin/活动管理
      summary: 创建活动
      operationId: admin_createActivity
      security:
        - BearerAuth:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
            examples:
              video:
                summary: 视频直播
                value:
                  provider: vhall
                  title: 开发者大会
                  startTime: "2026-10-01 20:00:00"
                  endTime: "2026-10-01 22:00:00"
                  type: 2
                  introduction: 简介
                  coverUrl: "https://cnstatic01.e.vhall.com/upload/xxx.jpg"
                  ultraLowLatency: false
                  autoList: true
                  hostIds:
                    - "10001"
                  ownerIds:
                    - "10001"
                  products: []
                  coursewareMaterialIds: []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
    get:
      tags:
        - admin/活动管理
      summary: 活动列表
      operationId: admin_listActivities
      security:
        - BearerAuth:
            []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 从 1 起（D37）
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: keyword
          in: query
          schema:
            type: string
          description: 标题或本站活动 UUID
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ActivityState"
        - name: provider
          in: query
          schema:
            $ref: "#/components/schemas/Provider"
        - name: shelfStatus
          in: query
          schema:
            $ref: "#/components/schemas/ShelfStatus"
        - name: startFrom
          in: query
          schema:
            type: string
            example: "2026-10-01"
          description: yyyy-MM-dd
        - name: startTo
          in: query
          schema:
            type: string
            example: "2026-10-31"
          description: yyyy-MM-dd
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseActivityList"
  /api/activities/{id}:
    get:
      tags:
        - admin/活动管理
      summary: 活动详情
      operationId: admin_getActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseActivityDetail"
    put:
      tags:
        - admin/活动管理
      summary: 改活动（基本信息 Tab）
      operationId: admin_updateActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
    delete:
      tags:
        - admin/活动管理
      summary: 软删活动
      operationId: admin_deleteActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
  /api/activities/{id}/playback:
    put:
      tags:
        - admin/活动管理
      summary: 回放设置
      operationId: admin_updatePlayback
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSettingsRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
  /api/activities/{id}/sales:
    put:
      tags:
        - admin/活动管理
      summary: 售卖设置
      operationId: admin_updateSales
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesSettingsRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSales"
  /api/activities/{id}/end:
    post:
      tags:
        - admin/活动管理
      summary: 结束直播
      operationId: admin_endActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEndActivity"
  /api/activities/{id}/shelf:
    post:
      tags:
        - admin/活动管理
      summary: 上架 / 下架
      operationId: admin_shelfActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShelfRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseShelf"
  /api/activities/{id}/audits:
    get:
      tags:
        - admin/活动管理
      summary: 审核记录
      operationId: admin_listActivityAudits
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAudits"
  /api/activities/{id}/audit:
    post:
      tags:
        - admin/活动管理
      summary: 提交审核
      operationId: admin_auditActivity
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditSubmitRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuditSubmit"
  /api/activities/{id}/records:
    get:
      tags:
        - admin/活动管理
      summary: 某场活动的回放列表
      operationId: admin_listActivityRecords
      security:
        - BearerAuth:
            []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRecordList"
  /api/activities/{id}/host:
    get:
      tags:
        - admin/活动管理
      summary: 主持人开播链接
      description: 管理端拿到 hostUrl 后新窗口打开，不要 iframe。canBroadcast 不为真 → 400。
