components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理端 access JWT；不要带 refresh
  parameters:
    ActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      description: 本站活动 UUID
    MaterialId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 素材 / 分组 UUID
    WatchActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      description: 本站活动 UUID
  schemas:
    ApiResponseBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          description: "0 成功；400/401/403/500/501/502…"
          example: 0
        msg:
          type: string
          example: ok
    Provider:
      type: string
      enum:
        - vhall
        - aliyun
        - tencent
      description: 直播服务商；创建后不可改
    ActivityType:
      type: integer
      enum:
        - 1
        - 2
        - 3
        - 4
      description: "1音频 / 2视频 / 3互动 / 4录播"
    ActivityState:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      description: "0全部(列表筛) / 1直播 / 2预告 / 3结束 / 4点播 / 5回放"
    ViewerStyle:
      type: string
      enum:
        - traditional
        - immersive
    WarmupType:
      type: string
      enum:
        - image
        - video
    ShelfStatus:
      type: string
      enum:
        - pending
        - "on"
        - "off"
        - banned
    RiskStatus:
      type: string
      enum:
        - pending
        - passed
        - rejected
    SellType:
      type: string
      enum:
        - free
        - paid
        - encrypted
        - specified
    AccessValidityType:
      type: string
      enum:
        - long
        - days
    PlaybackValidityType:
      type: string
      enum:
        - forever
        - days
    MaterialType:
      type: string
      enum:
        - image
        - video
        - document
        - article
    MaterialFileType:
      type: string
      enum:
        - image
        - video
        - document
      description: 批量登记仅接受文件类型，不含 article
    AuditWriteStatus:
      type: string
      enum:
        - passed
        - rejected
    MaterialAuditStatus:
      type: string
      enum:
        - pending
        - passed
        - rejected
    IdData:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    EmployeeBrief:
      type: object
      properties:
        id:
          type: string
          description: rs_mainkey_id 十进制字符串
        userName:
          type: string
        avatar:
          type: string
        userAccount:
          type: string
    ProductRef:
      type: object
      required:
        - spuId
        - productName
      properties:
        spuId:
          type: string
          description: 十进制字符串
        productName:
          type: string
          minLength: 1
          maxLength: 128
    CoursewareItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/MaterialType"
        url:
          type: string
    CaptchaData:
      type: object
      required:
        - captchaId
        - imageBase64
      properties:
        captchaId:
          type: string
          format: uuid
        imageBase64:
          type: string
          description: "data:image/png;base64,... 可直接作 img src"
    LoginRequest:
      type: object
      required:
        - userAccount
        - password
        - captchaId
        - captchaCode
      properties:
        userAccount:
          type: string
        password:
          type: string
          description: AES-256-GCM：IV(12)+ciphertext+tag → Base64
        captchaId:
          type: string
          format: uuid
        captchaCode:
          type: string
    LoginPendingData:
      type: object
      required:
        - state
        - expiresIn
      properties:
        state:
          type: string
          description: 微信 qrconnect state
        expiresIn:
          type: integer
          description: 秒；建议 120～180
    LoginQueryData:
      type: object
      properties:
        status:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
          description: "0 pending / 1 success / 2 failed / 3 expired"
        errorMsg:
          type: string
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: access 秒数，默认 7200
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          description: refresh 秒数，默认 604800
        user:
          $ref: "#/components/schemas/EmployeeBrief"
    RefreshRequest:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: 旧 access，过期也要原样带上
        refreshToken:
          type: string
    TokenPairData:
      type: object
      required:
        - accessToken
        - expiresIn
        - refreshToken
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 7200
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          example: 604800
    UploadImageData:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: 微吼 domain_url
    TosStsData:
      type: object
      required:
        - region
        - endpoint
        - bucketName
        - accessKeyId
        - secretAccessKey
        - sessionToken
        - expiredTime
      properties:
        region:
          type: string
          example: cn-shanghai
        endpoint:
          type: string
          example: tos-cn-shanghai.volces.com
          description: "主机名，无 https://"
        bucketName:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        sessionToken:
          type: string
        expiredTime:
          type: string
          description: ISO-8601 UTC（带 Z）
          example: "2026-10-10T06:00:00Z"
    MaterialGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        count:
          type: integer
        isDefault:
          type: boolean
    MaterialItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MaterialType"
        groupId:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: 文章省略
        objectKey:
          type: string
          description: 文章省略
        thumbUrl:
          type: string
        meta:
          type: string
        fileSize:
          type: integer
          format: int64
        status:
          type: string
          example: available
        aiAuditStatus:
          $ref: "#/components/schemas/MaterialAuditStatus"
        riskAuditStatus:
          $ref: "#/components/schemas/MaterialAuditStatus"
        uploaderId:
          type: string
        uploaderName:
          type: string
        departmentName:
          type: string
        uploadedAt:
          type: string
          example: "2026-10-12 14:00:00"
    MaterialListData:
      type: object
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        list:
          type: array
          items:
            $ref: "#/components/schemas/MaterialItem"
    MaterialRegisterRequest:
      type: object
      required:
        - type
        - groupId
        - items
      properties:
        type:
          $ref: "#/components/schemas/MaterialFileType"
        groupId:
