              description: 员工邀请
            - value: audience
              name: 观众邀请
              description: 观众邀请
        username:
          type: string
          maxLength: 16
          description: "邀请人 viewer.username。仅 inviterKind=audience 时使用且必填；不是被邀请观众（被邀请人只从 JWT 取）；库：VARCHAR(16)"
    WatchAudienceAttributeData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 主键 id；库：BIGINT
        username:
          type: string
          maxLength: 16
          description: 用户中心 viewer.username（业务观众身份，D118）；JWT sub、关联表、订单中心 username 与 third_user_id 均取此值；库：VARCHAR(16)
    WatchAudienceSalesmanData:
      type: object
      description: 本场业务员。读 activity_audience：仅 employee_inviter_id（员工邀请人）经账号 yhid 查 hr_uimsyhxx.identifier，并取在职岗位 id 最小一条的 hr_uimsyhgwxx.bmid 作 salesmanDeptId；无邀请人或档案缺失则 salesmanId 为 null。不回退 importer_id。供观看页创建订单传订单中心。
      properties:
        salesmanId:
          type: string
          nullable: true
          description: hr_uimsyhxx.identifier（UUID 字符串）。有有效员工邀请人且档案存在时返回；无邀请人或查不到则为 null（前端创建订单时不传 salesmanId）。不是 sys_useraccount.rs_mainkey_id。
          example: a0d9a8a1-a6d8-4978-8cb4-e7e86fba9c39
        salesmanDeptId:
          type: integer
          format: int64
          nullable: true
          description: hr_uimsyhgwxx.bmid（在职岗位取岗位主键最小一条）。有 identifier 但无岗位时可为 null；前端仅在有正整数时写入订单中心 salesmanDeptId。；库：BIGINT
          example: 94
    DictDataItem:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          description: 字典标签，对应 sys_dict_data.dict_label。例：wx_wap
        value:
          type: integer
          description: 字典键值，对应 sys_dict_data.dict_value。例：4；库：INT
    DictData:
      type: object
      description: "系统字典。先查 sys_dict_type（dict_dm + rs_status=1），再查 sys_dict_data（dict_id + rs_status=1），按 rs_dispindex、主键升序"
      required:
        - dictDm
        - dictName
        - list
      properties:
        dictDm:
          type: string
          description: 字典代码，回显路径参数。例：pay_channel
        dictName:
          type: string
          description: 字典名称，对应 sys_dict_type.dict_name。例：支付渠道
        list:
          type: array
          description: 启用中的字典项；无项时为空数组
          items:
            $ref: "#/components/schemas/DictDataItem"
    WatchCourseEnrollRequest:
      type: object
      description: "课程分享登记学员的邀请字段（与直播 attribute 同形）。被邀请学员 username 只从 Authorization 解析，禁止用 Body.username 冒充学员。无邀请字段时可省略 Body 或传空对象，只 upsert 学员行。有邀请意图时 inviterId 必传；inviterKind=audience 时另传邀请人 username，本轮 → 400「不记录观众邀请」。"
      properties:
        inviterId:
          type: integer
          format: int64
          description: 邀请人 id。有邀请时必传（大于 0）。employee：员工 rs_mainkey_id，行上员工邀请人仍空则写入；audience：亦必传，本轮不落库；库：BIGINT
        inviterKind:
          type: string
          enum:
            - employee
            - audience
          description: employee 员工邀请 / audience 观众邀请
          x-apifox-enum:
            - value: employee
              name: 员工邀请
              description: 员工邀请
            - value: audience
              name: 观众邀请
              description: 观众邀请
        username:
          type: string
          maxLength: 16
          description: "邀请人 viewer.username。仅 inviterKind=audience 时使用且必填；不是被邀请学员（学员只从 JWT 取）；库：VARCHAR(16)"
    WatchCourseEnrollData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: course_user 行 id；库：BIGINT
        username:
          type: string
          maxLength: 16
          description: 被邀请学员 viewer.username（JWT 解析结果）；库：VARCHAR(16)
        courseId:
          $ref: "#/components/schemas/BusinessUuid"
          description: 课程 UUID
        created:
          type: boolean
          description: true 新建；false 已有行（不改权益/到期）；库：TINYINT(1)
        title:
          type: string
          description: 课程标题；库：VARCHAR(64)
          maxLength: 64
    WatchCourseLessonProgressRequest:
      type: object
      required:
        - lessonNodeId
        - event
      properties:
        lessonNodeId:
          type: integer
          format: int64
          description: "本课未软删小节节点 id（course_catalog_node.id，须 node_type=小节）；库：BIGINT"
        event:
          type: string
          description: open 打开小节 / heartbeat 学习中心跳 / scroll_bottom 文档或文章滚到底 / live_ended 在线直播结束进入结束页
          enum:
            - open
            - heartbeat
            - scroll_bottom
            - live_ended
          x-apifox-enum:
            - value: open
              name: 打开小节
              description: 打开小节
            - value: heartbeat
              name: 学习中心跳
              description: 学习中心跳
            - value: scroll_bottom
              name: 文档或文章滚到底
              description: 文档或文章滚到底
            - value: live_ended
              name: 在线直播结束进入结束页
              description: 在线直播结束进入结束页
        deltaLearnDurationSec:
          type: integer
          format: int64
          description: 本次学习时长增量（秒），≥0 整数；缺省按 0；负值拒收。服务端累加到 learnDurationSec；库：BIGINT
        progressBarSec:
          type: integer
          description: 进度条当前位置（秒），≥0；服务端与库内已有值取 max，只升不降；图文档类可省略；库：INT
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 学习进度百分数 0～100；服务端与库内取 max。视频/直播回放达到 100 记小节完成；库：INT
    WatchCourseLessonProgressData:
      type: object
      required:
        - lessonNodeId
        - participateStatus
        - learnDurationSec
        - progressPercent
        - completed
      properties:
        lessonNodeId:
          type: integer
          format: int64
          description: 本课小节节点 id；库：BIGINT
        participateStatus:
          type: integer
          description: 参与状态：0 未开始 / 1 进行中 / 2 已完成；库：INT
          enum:
            - 0
            - 1
            - 2
          x-apifox-enum:
            - value: 0
              name: 未开始
              description: 未开始
            - value: 1
              name: 进行中
              description: 进行中
            - value: 2
              name: 已完成
              description: 已完成
        learnDurationSec:
          type: integer
          format: int64
          description: 累计学习时长（秒）；按历次 deltaLearnDurationSec 累加；库：BIGINT
        progressBarSec:
          type: integer
          nullable: true
          description: 进度条最远点（秒）；图文档类可空；库：INT
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: 学习进度 0～100；库：INT
        completed:
          type: boolean
          description: "本次上报后是否已完成（participateStatus=2）；库：TINYINT(1)"
