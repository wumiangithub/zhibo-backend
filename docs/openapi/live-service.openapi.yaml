          maxLength: 50
        head:
          type: string
          description: "对应微吼 JSSDK 初始化参数 head：服务端下发已拼好的绝对 http(s) URL，不是相对路径；本签名接口不会把 objectKey 与 CDN 域名再拼接。底座来源：观看端取 viewer.avatar_url（去空白）；中控台按本场 activity_member.avatar_url → 员工 headimgurl → user_avatar。空白或无记录时改用默认底座 https://qklive-testcos.cjs99.com/viewer/avatar/default-avatar.png（可用环境变量 ZHIBO_DEFAULT_AVATAR_URL / 配置 zhibo.default-avatar-url 覆盖）。拼接规则：去掉 #fragment、去掉已有查询参数 v（大小写不敏感，其它 query 保留），再追加 ?v={身份}（URL 已有其它 query 则用 &v=）。身份与进房 email 本地部分 / sdk.account 一致：观看为 viewer.username（例 ?v=qk_u_xxx），中控台为 z{员工id}（例 ?v=z276）。响应始终非空字符串；非空 head 参与签名（空串勿签入，否则微吼 20005）。前端 new VhallSDK 须原样传入本字段，不要自行改写或再拼 CDN（D111）"
        webinarId:
          type: string
          description: "微吼活动号（= provider_room_id）；仅 provider=vhall"
        appKey:
          type: string
          description: 微吼 app_key
        signedAt:
          type: string
          description: 签名时间戳（约 5 分钟有效）
        signType:
          type: integer
          example: 0
          description: 签名类型；通常 0；库：INT
        sign:
          type: string
          description: 服务端 SecretKey 算出的签名；勿返回 secret
