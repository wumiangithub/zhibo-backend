openapi: "3.0.3"
info:
  title: zhibo live-service
  description: |
    钱坤直播观看端 / 中控台 API（live-service :8082）。
    
    契约来源：`zhibo-shared/docs/API约定.md`（D58/D61）。
    本文件供 Apifox 导入，也是正式后端按文档反向实现的权威输入之一。
    
    **通则**
    - 成功：`code === 0`（HTTP 仍多为 200）
    - 活动路径 `{id}` 均为本站 **UUID**
    - 时间：`yyyy-MM-dd HH:mm:ss`
    - JSON 不输出 `null` 字段
    - 观看端不走管理端 JWT
  version: "2.3.1"
  contact:
    name: zhibo-backend
servers:
  - url: "http://127.0.0.1:8082"
    description: 本地 live-service
tags:
  - name: 观看
  - name: 进出房
  - name: 中控台
  - name: 回调
paths:
  /api/v1/watch/activities:
    get:
      tags:
        - 观看
      summary: 活动列表（精简）
      operationId: listWatchActivities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
        - name: state
          in: query
          schema:
            type: integer
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchList"
  /api/v1/watch/detail/{id}:
    get:
      tags:
        - 观看
      summary: 观看嵌入（iframe 兜底）
      operationId: getWatchEmbed
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: guestId
          in: query
          schema:
            type: string
            pattern: "^[A-Za-z0-9]+$"
          description: 只能字母数字；不传则后端生成
        - name: nickname
          in: query
          schema:
            type: string
            maxLength: 50
          description: 默认「观众」
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchEmbed"
  /api/v1/watch/sdk/{id}:
    get:
      tags:
        - 观看
      summary: 学生端观看 SDK 初始化载荷
      operationId: getWatchSdk
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: guestId
          in: query
          schema:
            type: string
            pattern: "^[A-Za-z0-9]+$"
          description: 只能字母数字；不传则后端生成
        - name: nickname
          in: query
          schema:
            type: string
            maxLength: 50
          description: 默认「观众」
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchSdk"
  /api/v1/watch/attendance/enter/{id}:
    post:
      tags:
        - 进出房
      summary: 进入（辅通道）
      description: "前端在 VITE_ATTENDANCE_CLIENT_REPORT=true 时调用。"
      operationId: attendanceEnter
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceEnterRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseId"
  /api/v1/watch/attendance/leave/{id}:
    post:
      tags:
        - 进出房
      summary: 离开（辅通道，批量）
      operationId: attendanceLeave
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceLeaveRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttendanceLeave"
  /api/v1/callbacks/vhall/presence:
    post:
      tags:
        - 回调
      summary: 微吼上下线回调（主通道）
      description: 微吼主动 POST，不是前端调用。method_id 须为 20。
      operationId: vhallPresenceCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VhallPresenceCallback"
      responses:
        200:
          description: 按微吼约定响应
  /api/v1/watch/attendees/{id}:
    get:
      tags:
        - 中控台
      summary: 中控台进出名单
      description: 打开页面、换 Tab、搜索、加载更多时调用；不要轮询。
      operationId: listWatchAttendees
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: tab
          in: query
          schema:
            type: string
            enum:
              - all
              - online
              - offline
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAttendeeList"
  /api/v1/watch/presence-trend/{id}:
    get:
      tags:
        - 中控台
      summary: 进出三线走势
      description: 数据来自 presence_event，不要调微吼 report/online。
      operationId: getWatchPresenceTrend
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: startTime
          in: query
          required: true
          schema:
            type: string
        - name: endTime
          in: query
          required: true
          schema:
            type: string
        - name: bucketSeconds
          in: query
          schema:
            type: integer
            default: 60
            enum:
              - 60
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePresenceTrend"
  /api/v1/watch/chat-filter/{id}:
    get:
      tags:
        - 中控台
      summary: 聊天审核页 URL
      operationId: getChatFilterPage
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: email
          in: query
          schema:
            type: string
          description: "默认 assistant@zhibo.local"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 30
          description: 默认「助理」
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChatFilter"
components:
  parameters:
    WatchActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      description: 本站活动 UUID
  schemas:
    ApiResponseBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          example: 0
          description: 业务码：0 成功；400/401/403/500/501/502…；库：INT
        msg:
          type: string
          example: ok
          description: 提示文案；成功一般为 ok；库：VARCHAR(256)
          maxLength: 256
    Provider:
      type: string
      enum:
        - vhall
        - aliyun
        - tencent
    IdData:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: 本站业务主键（活动/素材等多为 UUID）；库：VARCHAR(36)
          maxLength: 36
    WatchActivitySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 本站活动 UUID；库：VARCHAR(36)
          maxLength: 36
        title:
          type: string
          description: 标题；库：VARCHAR(64)
          maxLength: 64
        state:
          type: integer
          description: 活动状态；库：INT
        startTime:
          type: string
          description: "开始时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        coverUrl:
          type: string
          description: 封面图 URL；库：VARCHAR(2048)
          maxLength: 2048
    WatchActivityListData:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: 总条数；库：BIGINT
        list:
          type: array
          items:
            $ref: "#/components/schemas/WatchActivitySummary"
          description: 列表数据
    WatchEmbedData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 本站活动 UUID；库：VARCHAR(36)
          maxLength: 36
        title:
          type: string
          description: 标题；库：VARCHAR(64)
          maxLength: 64
        state:
          type: integer
          description: 活动状态；库：INT
        type:
          type: integer
          description: 活动类型；库：INT
        nickname:
          type: string
          description: 昵称；库：VARCHAR(64)
          maxLength: 64
        guestId:
          type: string
          description: 本站生成的游客 id；库：VARCHAR(64)
          maxLength: 64
        startTime:
          type: string
          description: "开始时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        endTime:
          type: string
          description: "结束时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        embedUrl:
          type: string
          format: uri
          description: 嵌入页 URL；库：VARCHAR(1024)
          maxLength: 1024
    VhallSdkPayload:
      type: object
      properties:
        scriptUrl:
          type: string
          format: uri
          description: SDK 脚本地址
        jqueryUrl:
          type: string
          nullable: true
          description: jQuery 脚本地址
        account:
          type: string
          description: 回显用；init 不要传
        email:
          type: string
          description: 合成邮箱（观看身份）；库：VARCHAR(128)
          maxLength: 128
        username:
          type: string
          description: 观看昵称；库：VARCHAR(50)
          maxLength: 50
        webinarId:
          type: string
          description: 微吼活动号
        appKey:
          type: string
          description: 微吼 app_key
        signedAt:
          type: string
          description: 签名时间戳
        signType:
          type: integer
          example: 0
          description: 签名类型；库：INT
        sign:
          type: string
          description: 签名串
    WatchSdkData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 本站活动 UUID；库：VARCHAR(36)
          maxLength: 36
        provider:
          $ref: "#/components/schemas/Provider"
          description: 直播服务商
        title:
          type: string
          description: 标题；库：VARCHAR(64)
          maxLength: 64
        state:
          type: integer
          description: 活动状态；库：INT
        type:
          type: integer
          description: 活动类型；库：INT
        nickname:
          type: string
          description: 昵称；库：VARCHAR(64)
          maxLength: 64
        guestId:
          type: string
          description: 本站生成的游客 id；库：VARCHAR(64)
          maxLength: 64
        startTime:
          type: string
          description: "开始时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        endTime:
          type: string
          description: "结束时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        sdk:
          $ref: "#/components/schemas/VhallSdkPayload"
          description: 观看 JS SDK 初始化参数
        embedUrl:
          type: string
          format: uri
          description: 嵌入页 URL；库：VARCHAR(1024)
          maxLength: 1024
    AttendanceEnterRequest:
      type: object
      required:
        - userId
        - enterTime
      properties:
        userId:
          type: string
          description: 用户标识（第三方观众 id，非员工主键）；库：VARCHAR(128)
          maxLength: 128
        enterTime:
          type: string
          example: "2026-09-30 10:00:00"
          description: "进入时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        mid:
          type: string
          description: 幂等/消息 id；库：VARCHAR(64)
          maxLength: 64
        nickname:
          type: string
          description: 昵称；库：VARCHAR(64)
          maxLength: 64
        avatarUrl:
          type: string
          description: 头像 URL；库：VARCHAR(512)
          maxLength: 512
    AttendanceLeaveRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - userId
              - enterTime
              - leaveTime
            properties:
              userId:
                type: string
                description: 用户标识（第三方观众 id，非员工主键）；库：VARCHAR(128)
                maxLength: 128
              enterTime:
                type: string
                description: "进入时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
              leaveTime:
                type: string
                description: "离开时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
              mid:
                type: string
                description: 幂等/消息 id；库：VARCHAR(64)
                maxLength: 64
          description: 条目列表
    AttendanceLeaveData:
      type: object
      properties:
        updated:
          type: integer
          description: 成功更新条数；库：INT
        skipped:
          type: integer
          description: 跳过条数；库：INT
        missing:
          type: integer
          description: 未找到条数；库：INT
    AttendeeItem:
      type: object
      required:
        - userId
        - enterTime
        - online
      properties:
        userId:
          type: string
          description: 用户标识（第三方观众 id，非员工主键）；库：VARCHAR(128)
          maxLength: 128
        nickname:
          type: string
          description: 昵称；库：VARCHAR(64)
          maxLength: 64
        avatarUrl:
          type: string
          description: 头像 URL；库：VARCHAR(512)
          maxLength: 512
        enterTime:
          type: string
          description: "进入时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        leaveTime:
          type: string
          description: "离开时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        online:
          type: boolean
          description: 是否在线；库：TINYINT(1)
    AttendeeListData:
      type: object
      required:
        - activityState
        - total
        - page
        - pageSize
        - list
      properties:
        activityState:
          type: integer
          description: 活动状态；库：INT
        total:
          type: integer
          format: int64
          description: 总条数；库：BIGINT
        page:
          type: integer
          description: 页码，从 1 开始（D37）；库：INT
        pageSize:
          type: integer
          description: 每页条数；库：INT
        list:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeItem"
          description: 列表数据
    PresenceTrendPoint:
      type: object
      properties:
        time:
          type: string
          description: 时间点；库：DATETIME(3)
        online:
          type: integer
          description: 该桶在线人数；库：INT
        enter:
          type: integer
          description: 进场人数；库：INT
        leave:
          type: integer
          description: 离场人数；库：INT
    PresenceTrend:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 本站活动 UUID；库：VARCHAR(36)
          maxLength: 36
        startTime:
          type: string
          description: "开始时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        endTime:
          type: string
          description: "结束时间，yyyy-MM-dd HH:mm:ss；库：DATETIME(3)"
        bucketSeconds:
          type: integer
          example: 60
          description: 时间桶秒数；库：INT
        points:
          type: array
          items:
            $ref: "#/components/schemas/PresenceTrendPoint"
          description: 时序点列表
    ChatFilterData:
      type: object
      required:
        - pageUrl
      properties:
        pageUrl:
          type: string
          format: uri
          description: 页面 URL；库：VARCHAR(2048)
          maxLength: 2048
    VhallPresenceCallback:
      type: object
      description: 微吼上下线回调 body（字段以微吼文档为准）
      properties:
        method_id:
          type: integer
          example: 20
          description: 微吼回调 method_id；库：INT
        type:
          type: string
          enum:
            - Join
            - Leave
          description: Join 进房 / Leave 离房；库：INT
        webinar_id:
          type: string
          description: 微吼活动号
        sender_id:
          type: string
          description: 发送方/观众 id
        time:
          type: integer
          description: Unix 秒；库：INT
        mid:
          type: string
          description: 幂等/消息 id；库：VARCHAR(64)
          maxLength: 64
        signature:
          type: string
          description: 回调签名
        context:
          type: object
          properties:
            nickname:
              type: string
              description: 昵称；库：VARCHAR(64)
              maxLength: 64
            avatar:
              type: string
              description: 头像 URL；库：VARCHAR(512)
              maxLength: 512
          description: 回调上下文
    ApiResponseId:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/IdData"
    ApiResponseWatchList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/WatchActivityListData"
    ApiResponseWatchEmbed:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/WatchEmbedData"
    ApiResponseWatchSdk:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/WatchSdkData"
    ApiResponseAttendanceLeave:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/AttendanceLeaveData"
    ApiResponseAttendeeList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/AttendeeListData"
    ApiResponsePresenceTrend:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/PresenceTrend"
    ApiResponseChatFilter:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              description: 业务数据；失败时可能省略
              $ref: "#/components/schemas/ChatFilterData"
