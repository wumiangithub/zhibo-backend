openapi: "3.0.3"
info:
  title: zhibo live-service
  description: |
    钱坤直播观看端 API（live-service :8082）。中控台已迁 admin-service（D110）。
    
    契约来源：`zhibo-shared/docs/API约定.md`；业务码与枚举汇总见 `zhibo-shared/docs/错误码与枚举.md`（D58/D61）。
    本文件供 Apifox 导入，也是正式后端按文档反向实现的权威输入之一。
    
    **通则**
    - 成功：`code === 0`（HTTP 仍多为 200）
    - 失败：固定业务码见 `components.schemas.BusinessResponseCode`；微吼等上游失败还可透传对方整型 code
    - 活动路径 `{id}` 均为本站 **32 位业务 UUID（D74）**
    - 时间：`yyyy-MM-dd HH:mm:ss`
    - JSON 不输出 `null` 字段
    - 观看端不走管理端 JWT
  version: "2.8.0"
  contact:
    name: zhibo-backend
servers:
  - url: "http://127.0.0.1:8082"
    description: 本地 live-service
tags:
  - name: 观看
  - name: 观众鉴权
  - name: 观众资料
  - name: 观众上传
  - name: 意见反馈
  - name: 我的学习
  - name: 回放
  - name: 评论
  - name: 直播分享进房
  - name: 开发
  - name: 中控台
  - name: 回调
paths:
  /api/v1/viewer/auth/wechat-login:
    post:
      tags:
        - 观众鉴权
      summary: 微信小程序登录
      operationId: viewerWechatLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerAuthWechatLoginRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerTokenPair"
  /api/v1/viewer/auth/phone-login:
    post:
      tags:
        - 观众鉴权
      summary: 手机号授权登录
      operationId: viewerPhoneLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerAuthPhoneLoginRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerTokenPair"
  /api/v1/viewer/auth/refresh:
    post:
      tags:
        - 观众鉴权
      summary: 刷新双票
      operationId: viewerAuthRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerAuthRefreshRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerTokenPair"
  /api/v1/viewer/auth/user-info:
    get:
      tags:
        - 观众鉴权
      summary: 当前观众
      operationId: viewerAuthUserInfo
      security:
        - BearerViewer:
            []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerUserInfo"
  /api/v1/viewer/profile/update:
    put:
      tags:
        - 观众资料
      summary: 更新昵称/头像
      description: 至少传 nickname 或成对的 avatarUrl+avatarObjectKey。头像只落库 avatar_url；avatarObjectKey 仅校验。成功 data 只回 nickname 与 avatarUrl（有则回），不回完整 user。
      operationId: viewerProfileUpdate
      security:
        - BearerViewer:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerProfileUpdateRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerProfileUpdate"
  /api/v1/viewer/uploads/file:
    post:
      tags:
        - 观众上传
      summary: 中转上传
      operationId: viewerUploadFile
      security:
        - BearerViewer:
            []
      parameters:
        - name: biz
          in: query
          required: true
          schema:
            type: integer
            enum:
              - 1
              - 2
            description: "1 头像 / 2 意见反馈截图"
            x-apifox-enum:
              - value: 1
                name: 头像
                description: 头像
              - value: 2
                name: 意见反馈截图
                description: 意见反馈截图
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - objectKey
              properties:
                file:
                  type: string
                  format: binary
                objectKey:
                  type: string
                contentType:
                  type: string
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerUploadFile"
  /api/v1/viewer/uploads/tos-sts:
    get:
      tags:
        - 观众上传
      summary: 直传 STS
      operationId: viewerUploadTosSts
      security:
        - BearerViewer:
            []
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerTosSts"
  /api/v1/viewer/feedback/submit:
    post:
      tags:
        - 意见反馈
      summary: 提交反馈
      operationId: viewerFeedbackSubmit
      security:
        - BearerViewer:
            []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerFeedbackSubmitRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerFeedbackId"
  /api/v1/viewer/feedback/list:
    get:
      tags:
        - 意见反馈
      summary: 我的反馈列表
      operationId: viewerFeedbackList
      security:
        - BearerViewer:
            []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerFeedbackList"
  /api/v1/viewer/feedback/detail/{id}:
    get:
      tags:
        - 意见反馈
      summary: 反馈详情
      operationId: viewerFeedbackDetail
      security:
        - BearerViewer:
            []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerFeedbackDetail"
  /api/v1/viewer/learning/lives:
    get:
      tags:
        - 我的学习
      summary: 我的学习·直播
      operationId: viewerLearningLives
      security:
        - BearerViewer:
            []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ActivityState"
            x-apifox-enum:
              - value: 0
                name: 全部(列表筛)
                description: 全部(列表筛)
              - value: 1
                name: 直播
                description: 直播
              - value: 2
                name: 预告
                description: 预告
              - value: 3
                name: 结束
                description: 结束
              - value: 4
                name: 点播
                description: 点播
              - value: 5
                name: 回放
                description: 回放
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchList"
  /api/v1/viewer/learning/courses:
    get:
      tags:
        - 我的学习
      summary: 我的学习·课程
      description: "仅 course_user 有效权益（entitlement_status=1 且未按售卖到期）且课程未软删；按获得权益时间倒序。"
      operationId: viewerLearningCourses
      security:
        - BearerViewer:
            []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerLearningCourses"
  /api/v1/viewer/learning/courses/detail/{courseId}:
    get:
      tags:
        - 我的学习
      summary: 我的学习·课程详情
      description: 需 course_user 有效权益且课程未软删；返回封面/有效期/简介/详情 HTML、子课程与扁平目录。无权益或不存在 → 400。
      operationId: viewerLearningCourseDetail
      security:
        - BearerViewer:
            []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
            pattern: "^[0-9a-f]{32}$"
            description: 本站业务 UUID（32 位小写十六进制无横线，D74）；库：VARCHAR(32)
          description: 本站课程 id（D74）
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerLearningCourseDetail"
  /api/v1/viewer/learning/courses/lessons/{courseId}/{lessonNodeId}:
    get:
      tags:
        - 我的学习
      summary: 我的学习·小节内容
      description: 需有效权益；返回直播 activityId 或素材 URL/文章 HTML，及本学员进度。无权益或不存在 → 400。
      operationId: viewerLearningLessonContent
      security:
        - BearerViewer:
            []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
            pattern: "^[0-9a-f]{32}$"
            description: 本站业务 UUID（32 位小写十六进制无横线，D74）；库：VARCHAR(32)
          description: 本站课程 id（D74）
        - name: lessonNodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 小节节点 id
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerLearningLessonContent"
  /api/v1/viewer/presence/ping:
    post:
      tags:
        - 观众鉴权
      summary: 访问心跳
      operationId: viewerPresencePing
      security:
        - BearerViewer:
            []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewerPresencePingRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseViewerPresencePing"
  /api/v1/watch/activities:
    get:
      tags:
        - 观看
      summary: 活动列表（精简）
      operationId: listWatchActivities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码，从 1 起（D37）；默认 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数；默认 20，最大 100
        - name: state
          in: query
          description: 活动状态；不传或 0 表示不过滤
          schema:
            $ref: "#/components/schemas/ActivityState"
            x-apifox-enum:
              - value: 0
                name: 全部(列表筛)
                description: 全部(列表筛)
              - value: 1
                name: 直播
                description: 直播
              - value: 2
                name: 预告
                description: 预告
              - value: 3
                name: 结束
                description: 结束
              - value: 4
                name: 点播
                description: 点播
              - value: 5
                name: 回放
                description: 回放
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchList"
  /api/v1/watch/access/{id}:
    get:
      tags:
        - 观看
      summary: 观看售卖门禁状态
      description: 可匿名探态。可选观众 Authorization；加密已解锁则带 X-Activity-Access。返回 accessState（D90/D115）。未登录含免费场亦为 need_login；真正拿 summary/records/tos 须登录。
      operationId: getWatchAccess
      security: []
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: X-Activity-Access
          in: header
          required: false
          schema:
            type: string
          description: 本场访问 JWT（加密售卖解锁后；勿塞进观众 Authorization）
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchAccess"
  /api/v1/watch/access/verify-password/{id}:
    post:
      tags:
        - 观看
      summary: 校验观看密码并发本场访问 JWT
      description: "须已登录（观众 Authorization）；未登录 → 403「请先登录」。仅 sellAlone=true 且 sellType=encrypted；密码错 → 400；已过期 → 403（D90/D115）。"
      operationId: verifyWatchAccessPassword
      security:
        - BearerViewer:
            []
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAccessVerifyPasswordRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchAccessVerifyPassword"
  /api/v1/watch/summary/{id}:
    get:
      tags:
        - 观看
      summary: 观看页活动摘要（页面壳）
      description: |
        观看页 / 中控台 / 回放页的页面壳：标题、态、时间、回放开关与有效期（D95/D106/D120）。
        响应立刻取本库 Activity，不含 SDK 签名；云补偿经 syncQuietlyAsync 异步旁路（info + 场次 + 结束类回放），不阻塞本接口。
        provider=vhall 且有 provider_room_id 时后台对账；首次可能仍见旧 state/场次，刷新后再进可见落库结果。
        非 vhall / 无 room id 跳过；云侧失败只日志、不 500。旧嵌入 /watch/detail 已删除（D122）。须过售卖门禁，未过 → 403。
      operationId: getWatchSummary
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: X-Activity-Access
          in: header
          required: false
          schema:
            type: string
          description: 本场访问 JWT（加密售卖解锁后；勿塞进观众 Authorization）
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchSummary"
  /api/v1/watch/sdk-sign:
    get:
      tags:
        - 观看
      summary: 观看 SDK 签名与初始化载荷
      description: |
        旧路径 GET /api/v1/watch/sdk/{id} 已删除。
        Query 仅 id + 可选 nickname；username 只从 Authorization 观众 JWT 解析（D96/D118）；无有效 JWT → 400「请先登录」。
        仅返回 id / provider / username / nickname / sdk（D95）；页壳字段见 /watch/summary/{id}。
        不下发 guestId / scriptUrl / jqueryUrl / embedUrl / title / state / playback*（D92/D93/D94/D95）。
        签名路径不调微吼 fetchRoom。未过售卖门禁 → 403。
        头像链接拼接（sdk.head）：取 viewer.avatar_url 绝对地址（去空白）；空白则用默认底座 https://qklive-testcos.cjs99.com/viewer/avatar/default-avatar.png（ZHIBO_DEFAULT_AVATAR_URL / zhibo.default-avatar-url）。本接口不做「CDN 域名 + 相对 objectKey」拼接。统一去掉 #fragment 与已有 v 参数后追加 ?v={username}（已有其它 query 则 &v=）；响应始终非空并参与签名。前端 new VhallSDK 原样传 head（D111）。
      operationId: getWatchSdkSign
      security:
        - BearerViewer:
            []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            maxLength: 32
            pattern: "^[0-9a-f]{32}$"
            description: 本站业务 UUID（32 位小写十六进制无横线，D74）；库：VARCHAR(32)
            example: a1b2c3d4e5f67890abcdef1234567890
          description: 本站活动 UUID（Query；相对 D62 的明确例外，见 D92）
        - name: nickname
          in: query
          schema:
            type: string
            maxLength: 50
          description: 默认「观众」；小程序已按展示昵称规则算好并拼进 web-view URL；username 只从 Authorization JWT 解析（D96/D118）
        - name: X-Activity-Access
          in: header
          required: false
          schema:
            type: string
          description: 本场访问 JWT（加密售卖解锁后；勿塞进观众 Authorization）
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchSdk"
  /api/v1/watch/products/{id}:
    get:
      tags:
        - 观看
      summary: 本场商品元数据
      description: 本场绑定 spu 快照（小黄车）。须过售卖门禁（含免费场须登录，D115），未过 → 403。活动不存在或已软删 → 400。
      operationId: getWatchProducts
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: X-Activity-Access
          in: header
          required: false
          schema:
            type: string
          description: 本场访问 JWT（加密售卖解锁后；勿塞进观众 Authorization）
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchProducts"
  /api/v1/watch/products/click/{id}:
    post:
      tags:
        - 观看
      summary: 小黄车商品点击埋点
      description: 直播/回放小黄车点「去抢购」时上报一次，追加 activity_product_click。须观众 JWT，无票 → 401。须过售卖门禁，未过 → 403。Body.spuId 须为本场已绑定商品，否则 400「商品未绑定本场」。打开弹层不计；下架禁点不调。失败不影响下单（前端 fire-and-forget）。
      operationId: watchProductClick
      security:
        - BearerViewer:
            []
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
        - name: X-Activity-Access
          in: header
          required: false
          schema:
            type: string
          description: 本场访问 JWT（加密售卖解锁后；勿塞进观众 Authorization）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchProductClickRequest"
      responses:
        200:
          description: "业务结果（看 body.code；成功 code===0）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchProductClick"
  /api/v1/watch/coupons/{id}:
    get:
      tags:
        - 观看
      summary: 本场已发优惠券列表
      description: 读本站 activity_coupon。list 非空则观看/回放侧栏显示「券」悬浮图标；点开弹层选券后，前端直连订单中心 POST /order-center/api/live/viewer/coupon/receive 领取（观众 JWT，见订单中心对接）。须过售卖门禁，未过 → 403。活动不存在或已软删 → 400。
      operationId: getWatchCoupons
      parameters:
        - $ref: "#/components/parameters/WatchActivityId"
