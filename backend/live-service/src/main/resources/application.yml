server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: live-service
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhibo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

vhall:
  app-key: ${VHALL_APP_KEY:}
  app-secret: ${VHALL_APP_SECRET:}
  callback-secret: ${VHALL_CALLBACK_SECRET:}

# 观众登录（D73；AppSecret / JWT 写 .env.local，缺省不拒启动）
# 不要复用管理端 AUTH_JWT_SECRET。aud 默认 viewer，管理端 aud=base 过不来。
viewer:
  jwt-secret: ${VIEWER_JWT_SECRET:}
  jwt-expire-seconds: ${VIEWER_JWT_EXPIRE_SECONDS:7200}
  jwt-refresh-expire-seconds: ${VIEWER_JWT_REFRESH_EXPIRE_SECONDS:604800}
  jwt-issuer: ${VIEWER_JWT_ISSUER:zhibo-viewer}
  jwt-audience: ${VIEWER_JWT_AUDIENCE:viewer}
  jwt-refresh-audience: ${VIEWER_JWT_REFRESH_AUDIENCE:viewer-refresh}
  wechat:
    mp-app-id: ${WECHAT_MP_APP_ID:}
    mp-app-secret: ${WECHAT_MP_APP_SECRET:}
