server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: live-service
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhibo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

vhall:
  app-key: ${VHALL_APP_KEY:}
  app-secret: ${VHALL_APP_SECRET:}
  callback-secret: ${VHALL_CALLBACK_SECRET:}

# 观众登录（D73；AppSecret / JWT 写 .env.local，缺省不拒启动）
# 不要复用管理端 AUTH_JWT_SECRET。aud 默认 viewer，管理端 aud=base 过不来。
viewer:
  jwt-secret: ${VIEWER_JWT_SECRET:}
  jwt-expire-seconds: ${VIEWER_JWT_EXPIRE_SECONDS:7200}
  jwt-refresh-expire-seconds: ${VIEWER_JWT_REFRESH_EXPIRE_SECONDS:604800}
  jwt-issuer: ${VIEWER_JWT_ISSUER:zhibo-viewer}
  jwt-audience: ${VIEWER_JWT_AUDIENCE:viewer}
  jwt-refresh-audience: ${VIEWER_JWT_REFRESH_AUDIENCE:viewer-refresh}
  wechat:
    mp-app-id: ${WECHAT_MP_APP_ID:}
    mp-app-secret: ${WECHAT_MP_APP_SECRET:}

# 回放 downloading in-flight 僵尸阈值（分钟）：按 JVM map 开始时间；重启后不在 map 立刻恢复
zhibo:
  activity-record:
    downloading-stale-minutes: ${ZHIBO_ACTIVITY_RECORD_DOWNLOADING_STALE_MINUTES:30}

# 火山 TOS（观众头像；与管理端共用 VOLC_*；缺省不拒启动）
volc:
  access-key: ${VOLC_ACCESS_KEY:}
  secret-key: ${VOLC_SECRET_KEY:}
  sts-role-trn: ${VOLC_STS_ROLE_TRN:trn:iam::2116729154:role/sts}
  tos-region: ${VOLC_TOS_REGION:cn-shanghai}
  tos-endpoint: ${VOLC_TOS_ENDPOINT:tos-cn-shanghai.volces.com}
  tos-bucket: ${VOLC_TOS_BUCKET:qky-live-sucai-test}
  tos-cdn-url: ${VOLC_TOS_CDN_URL:https://qklive-testcos.cjs99.com}
  sts-duration-seconds: ${VOLC_STS_DURATION_SECONDS:3600}
