server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: admin-service
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhibo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

vhall:
  app-key: ${VHALL_APP_KEY:}
  app-secret: ${VHALL_APP_SECRET:}

# 火山 TOS / STS（密钥优先 .env.local；缺省不拒启动，调接口时再 400）
volc:
  access-key: ${VOLC_ACCESS_KEY:}
  secret-key: ${VOLC_SECRET_KEY:}
  sts-role-trn: ${VOLC_STS_ROLE_TRN:trn:iam::2116729154:role/sts}
  tos-region: ${VOLC_TOS_REGION:cn-shanghai}
  tos-endpoint: ${VOLC_TOS_ENDPOINT:tos-cn-shanghai.volces.com}
  tos-bucket: ${VOLC_TOS_BUCKET:qky-live-sucai-test}
  sts-duration-seconds: ${VOLC_STS_DURATION_SECONDS:3600}

# 管理端登录（D41；Secret/AES/JWT 优先 .env.local）
auth:
  password-aes-key-base64: ${AUTH_PASSWORD_AES_KEY_BASE64:}
  jwt-secret: ${AUTH_JWT_SECRET:}
  jwt-expire-seconds: ${AUTH_JWT_EXPIRE_SECONDS:86400}
  wechat:
    open-app-id: ${WECHAT_OPEN_APP_ID:}
    open-app-secret: ${WECHAT_OPEN_APP_SECRET:}
    open-redirect-uri: ${WECHAT_OPEN_REDIRECT_URI:}
    # 本地可开：未绑定账号扫码写库绑定；默认 false（正式行为）
    allow-self-bind: ${AUTH_WECHAT_ALLOW_SELF_BIND:false}
